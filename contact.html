    <nav class="navbar">

        <div class="user-profile">C</div>
    </nav>

    <main class="contact-container">
        <div class="contact-info">
            <h1 class="contact-title">Let’s weave stories together.</h1>
            <p class="contact-desc">無論是出版合作、讀者來信，或是關於世界的隻字片語，都歡迎在此留下你的軌跡。</p>
            
            <div class="info-links">
                <a href="mailto:chen971023@gmail.com">chen971023@gmail.com</a>
                <div class="social-links">
                    <a href="https://www.instagram.com/_.zyngx._23/" target="_blank">Instagram</a> — 
                    <a href="https://github.com/ZiyanGZiyaNG" target="_blank">GitHub</a> — 
                    <a href="#">Discord</a> </div>
            </div>
        </div>

        <form class="contact-form" action="mailto:chen971023@gmail.com" method="POST" enctype="text/plain">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="Name" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="Email" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="message">The Message</label>
                <textarea id="message" name="Message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>

</body>
